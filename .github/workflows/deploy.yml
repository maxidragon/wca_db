name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [19.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install backend dependencies
      run: npm install
      working-directory: ./backend 
    # Each setting is a repository secret of its own. Values are single-quoted so dotenv and
    # the shell steps below (`. ./.env`) read them literally. JWT_SECRET, SESSION_SECRET and
    # FRONTEND_ORIGIN fall back to public defaults in the code, so the deploy stops without
    # them. Every other setting may be left unset, which keeps the code's default; an unset
    # SERVICE_TOKEN leaves the service token disabled.
    - name: Create .env
      run: |
        for name in JWT_SECRET SESSION_SECRET FRONTEND_ORIGIN; do
          if [ -z "${!name}" ]; then
            echo "::error::The $name repository secret is not set"
            exit 1
          fi
        done
        : > .env
        for name in PORT FRONTEND_ORIGIN SESSION_SECRET JWT_SECRET SERVICE_TOKEN \
            DB_HOST DB_USER DB_PASS DB_NAME QUERY_DB_USER QUERY_DB_PASS \
            WCA_CLIENT_ID WCA_CLIENT_SECRET STATISTICS_MEMORY_MB; do
          value="${!name}"
          [ -n "$value" ] || continue
          case "$value" in
            *"'"*|*$'\n'*)
              echo "::error::The $name secret contains a single quote or a newline"
              exit 1
              ;;
          esac
          printf "%s='%s'\n" "$name" "$value" >> .env
        done
      shell: bash
      working-directory: ./backend
      env:
        PORT: ${{ secrets.PORT }}
        FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        QUERY_DB_USER: ${{ secrets.QUERY_DB_USER }}
        QUERY_DB_PASS: ${{ secrets.QUERY_DB_PASS }}
        WCA_CLIENT_ID: ${{ secrets.WCA_CLIENT_ID }}
        WCA_CLIENT_SECRET: ${{ secrets.WCA_CLIENT_SECRET }}
        STATISTICS_MEMORY_MB: ${{ secrets.STATISTICS_MEMORY_MB }}
    - name: Build project
      run: npm run build
      working-directory: ./backend
    - name: Install frontend dependencies
      run: npm install
      working-directory: ./frontend
    - name: Build frontend
      run: npm run build
      working-directory: ./frontend
    # Deploys do not import, so a database last imported before statistics_entries existed
    # would serve 503s until the nightly import. Builds it once; a no-op after that.
    - name: Ensure statistics entries exist
      run: ./compute_statistics_entries.sh --if-missing
      working-directory: ./backend
    # The nemeses read the rank tables by event and rank. An import builds those indexes;
    # this adds them to a database imported before they existed, in seconds, once.
    - name: Ensure rank indexes exist
      run: |
        set -a; . ./.env; set +a
        mariadb --user="${DB_USER:-root}" --password="${DB_PASS:-}" "${DB_NAME:-wca}" < rank_indexes.sql
      working-directory: ./backend
    # The qualification lists read results by event and result. An import builds those
    # indexes; this adds them to a database imported before they existed, once.
    - name: Ensure qualification indexes exist
      run: |
        set -a; . ./.env; set +a
        mariadb --user="${DB_USER:-root}" --password="${DB_PASS:-}" "${DB_NAME:-wca}" < qualification_indexes.sql
      working-directory: ./backend
    - name: Restart service
      run: pm2 restart wca-db-backend -s || pm2 start dist/index.js --name wca-db-backend -s
      working-directory: ./backend
    # Deploys do not import. A database whose linkings or best ever ranks are missing gets
    # them here rather than at the next nightly import; a single query when they exist. After
    # the restart, because building them takes up to half an hour and the code does not
    # depend on them.
    - name: Ensure linkings exist
      run: ./compute_linkings.sh --if-missing
      working-directory: ./backend
    - name: Ensure best ever ranks exist
      run: ./compute_best_ever_ranks.sh --if-missing
      working-directory: ./backend
