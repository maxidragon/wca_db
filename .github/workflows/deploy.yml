name: Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [19.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install backend dependencies
      run: npm install
      working-directory: ./backend 
    - name: Create .env
      run: echo "${{ secrets.ENV_PRODUCTION }}" > .env
      working-directory: ./backend
    - name: Build project
      run: npm run build
      working-directory: ./backend
    - name: Install frontend dependencies
      run: npm install
      working-directory: ./frontend
    - name: Build frontend
      run: npm run build
      working-directory: ./frontend
    # Deploys do not import, so a database last imported before statistics_entries existed
    # would serve 503s until the nightly import. Builds it once; a no-op after that.
    - name: Ensure statistics entries exist
      run: ./compute_statistics_entries.sh --if-missing
      working-directory: ./backend
    - name: Restart service
      run: pm2 restart wca-db-backend -s || pm2 start dist/index.js --name wca-db-backend -s
      working-directory: ./backend