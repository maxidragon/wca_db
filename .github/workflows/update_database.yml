name: Update the database

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 720
    strategy:
      matrix:
        node-version: [19.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install backend dependencies
      run: npm install
      working-directory: ./backend 
    # Both workflows that restart the backend write the same .env; keep this env list in step with
    # deploy.yml and with SETTINGS in .github/scripts/write_backend_env.sh.
    - name: Create .env
      run: .github/scripts/write_backend_env.sh
      env:
        PORT: ${{ secrets.PORT }}
        FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_NAME: ${{ secrets.DB_NAME }}
        QUERY_DB_USER: ${{ secrets.QUERY_DB_USER }}
        QUERY_DB_PASS: ${{ secrets.QUERY_DB_PASS }}
        WCA_CLIENT_ID: ${{ secrets.WCA_CLIENT_ID }}
        WCA_CLIENT_SECRET: ${{ secrets.WCA_CLIENT_SECRET }}
        STATISTICS_MEMORY_MB: ${{ secrets.STATISTICS_MEMORY_MB }}
    - name: Build project
      run: npm run build
      working-directory: ./backend
    - name: Install frontend dependencies
      run: npm install
      working-directory: ./frontend
    - name: Build frontend
      run: npm run build
      working-directory: ./frontend
    # Builds the linkings and best ever ranks into the staging database too, so it needs the
    # backend built above and the live tables are replaced, never removed.
    - name: Update database
      run: ./update_database.sh
      working-directory: ./backend
    - name: Restart service
      run: pm2 restart wca-db-backend -s || pm2 start dist/index.js --name wca-db-backend -s
      working-directory: ./backend
